    <script>
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) { window.location.reload(); }
        });
        
        const formulario = document.getElementById('miFormulario');
        const btnTabMaquinas = document.getElementById('btn-tab-maquinas');
        const btnTabRefacciones = document.getElementById('btn-tab-refacciones');
        const btnTabReclamaciones = document.getElementById('btn-tab-reclamaciones');
        
        const grupoMaquinas = document.getElementById('grupo-maquinas');
        const grupoRefacciones = document.getElementById('grupo-refacciones');
        const grupoReclamaciones = document.getElementById('grupo-reclamaciones');
        const camposReporteReclamo = document.getElementById('campos-reporte-reclamo');
        
        const selectMaquina = document.getElementById('select-maquina');
        const inputSerie = document.getElementById('serie');
        const divDisposicionGeneral = document.getElementById('contenedor-disposicion');
        const divComentariosGenerales = document.getElementById('contenedor-comentarios-generales');
        
        const zonaEvaluacion = document.getElementById('zona-evaluacion');
        const bloquePiezas = document.getElementById('bloque-piezas');
        const cargandoMaquinas = document.getElementById('cargando-maquinas');
        const cargandoRefacciones = document.getElementById('cargando-refacciones');
        const boton = document.getElementById('btnEnviar');
        
        let modoActual = 'maquinas'; 
        let baseDeDatosMaquinas = {};
        let listaRefacciones = []; 
        let refaccionActual = null; 
        let modeloReclamoTemporal = "";

        const idsReclamacion = ['rec-defecto', 'rec-etapa', 'rec-justificacion', 'rec-horas', 'rec-costo'];

        window.onload = function() {
            google.script.run.withSuccessHandler(inicializarFormularioMaquinas).obtenerMaquinas();
            google.script.run.withSuccessHandler(inicializarListaRefacciones).obtenerRefacciones();
            construirSlotsFotosReclamacion();
        };

        function cambiarModo(modo) {
            modoActual = modo;
            zonaEvaluacion.style.display = 'none';
            bloquePiezas.innerHTML = '';
            document.getElementById('mensaje-busqueda').innerText = '';
            document.getElementById('buscador-codigo').value = '';
            document.getElementById('serie-reclamo').value = '';
            document.getElementById('mensaje-reclamo').innerText = '';
            camposReporteReclamo.classList.add('oculto');
            refaccionActual = null;
            
            const contContenedor = document.getElementById('contenedor-comun-contenedor');
            const contReferencia = document.getElementById('contenedor-comun-referencia');
            
            btnTabMaquinas.classList.remove('active');
            btnTabRefacciones.classList.remove('active');
            btnTabReclamaciones.classList.remove('active');
            
            grupoMaquinas.classList.add('oculto');
            grupoRefacciones.classList.add('oculto');
            grupoReclamaciones.classList.add('oculto');
 
            idsReclamacion.forEach(id => document.getElementById(id).required = false);

            if (modo === 'maquinas') {
                btnTabMaquinas.classList.add('active');
                grupoMaquinas.classList.remove('oculto');
                contContenedor.classList.remove('oculto');
                contReferencia.classList.remove('oculto');
                inputSerie.required = true;
                selectMaquina.required = true;
                document.getElementById('contenedor').required = true;
                document.getElementById('referencia').required = true;
                document.getElementById('proveedor').required = true;
                
                divDisposicionGeneral.classList.remove('oculto');
                divComentariosGenerales.classList.remove('oculto'); 
                document.getElementById('disposicion').required = true;
            } else if (modo === 'refacciones') {
                btnTabRefacciones.classList.add('active');
                grupoRefacciones.classList.remove('oculto');
                contContenedor.classList.remove('oculto');
                contReferencia.classList.remove('oculto');
                inputSerie.required = false;
                selectMaquina.required = false;
                document.getElementById('contenedor').required = true;
                document.getElementById('referencia').required = true;
                document.getElementById('proveedor').required = false;
                
                divDisposicionGeneral.classList.add('oculto');
                divComentariosGenerales.classList.add('oculto'); 
                document.getElementById('disposicion').required = false;
                
                if(!listaRefacciones || listaRefacciones.length === 0){
                    cargandoRefacciones.style.display = 'block';
                    cargandoRefacciones.innerText = 'No hay refacciones pendientes en la hoja.';
                } else {
                    cargandoRefacciones.style.display = 'none';
                }
            } else if (modo === 'reclamaciones') {
                btnTabReclamaciones.classList.add('active');
                grupoReclamaciones.classList.remove('oculto');
                
                contContenedor.classList.add('oculto');
                contReferencia.classList.add('oculto');
                document.getElementById('contenedor').required = false;
                document.getElementById('referencia').required = false;
                document.getElementById('proveedor').required = false;
                inputSerie.required = false;
                selectMaquina.required = false;
                
                divDisposicionGeneral.classList.add('oculto');
                divComentariosGenerales.classList.add('oculto');
                document.getElementById('disposicion').required = false;
            } 
        }

        function inicializarFormularioMaquinas(datos) {
            baseDeDatosMaquinas = datos;
            Object.keys(baseDeDatosMaquinas).sort().forEach(nombre => {
                let opcion = document.createElement('option');
                opcion.value = nombre; opcion.textContent = nombre;
                selectMaquina.appendChild(opcion);
            });
            cargandoMaquinas.style.display = 'none';
            selectMaquina.style.display = 'block';
        }

        function inicializarListaRefacciones(datos) {
            listaRefacciones = datos;
            cargandoRefacciones.style.display = 'none';
        }

        function generarBloqueHTML(index, tituloVisual, subtitulo, tituloBackend, identificador, mostrarDisposicion = false) {
            let htmlDisp = "";
            if (mostrarDisposicion) {
                htmlDisp = `
                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #e5e7eb;">
                    <label style="font-size: 13px; margin-bottom: 6px; display: block; font-weight: bold; color: var(--accent);">Disposición de esta refacción:</label>
                    <select id="disp_item_${index}" required style="padding: 10px; font-size: 13px; width: 100%; border-radius: 6px; border: 1px solid #d1d5db;">
                        <option value="" disabled selected>-- Dictamen Técnico --</option>
                        <option value="Aceptado">Aceptado / Accepted</option>
                        <option value="Aceptado con Desviación">Aceptado con Desviación / Accpt. w/ Deviation</option>
                        <option value="Rechazado">Rechazado / Rejected</option>
                    </select>
                </div>`;
            }

            let htmlFotos = "";
            for (let f = 1; f <= 3; f++) {
                htmlFotos += `
                <div style="display: flex; gap: 6px; align-items: center; margin-top: 6px; background: #f8fafc; padding: 4px; border-radius: 6px; border: 1px solid #e2e8f0;">
                    <span style="font-size: 11px; font-weight: 700; color: #475569; width: 50px;">Foto ${f}:</span>
                    <button type="button" class="custom-file-btn" style="flex: 1; padding: 5px; margin:0; font-size:11px;" onclick="seleccionarFoto(${index}, ${f}, 'camara')"> Camara</button>
                    <button type="button" class="custom-file-btn" style="flex: 1; padding: 5px; margin:0; font-size:11px;" onclick="seleccionarFoto(${index}, ${f}, 'galeria')"> Galería</button>
                    <input type="file" id="foto_${index}_${f}" style="display:none;" accept="image/*" onchange="actualizarTextoFoto(this, ${index}, ${f})">
                    <span id="texto-foto-${index}-${f}" class="texto-foto" style="flex: 1.5; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size:11px;">No elegida</span>
                </div>`;
            }

            return `
            <div class="evaluacion-item">
                <div class="pieza-header">
                    <div class="pieza-titulo">${tituloVisual}</div>
                    ${subtitulo ? `<span class="pieza-criterio" style="margin-top: 6px;">${subtitulo}</span>` : ''}
                </div>
                
                <div class="radio-group">
                    <label class="radio-cumple">
                        <input type="radio" name="eval_${index}" value="Cumple" required>
                        <span> Cumple</span>
                    </label>
                    <label class="radio-nocumple">
                        <input type="radio" name="eval_${index}" value="No cumple" required>
                        <span> No cumple</span>
                    </label>
                </div>
                
                ${htmlDisp}
                
                <input type="text" class="comentario-input" id="comentario_${index}" placeholder=" Comentarios u observaciones..." style="margin-top:15px;">
                
                <div class="custom-file-wrapper">
                    <label style="font-size: 12px; margin-bottom: 2px; font-weight: bold;">Evidencias de Inspección (Máx. 3):</label>
                    ${htmlFotos}
                </div>

                <input type="hidden" id="nombreEval_${index}" value="${tituloBackend}">
                <input type="hidden" id="idEval_${index}" value="${identificador}">
            </div>`;
        }

        function construirSlotsFotosReclamacion() {
            const contenedor = document.getElementById('contenedor-fotos-reclamo');
            let html = "";
            for (let f = 1; f <= 3; f++) {
                html += `
                <div style="display: flex; gap: 8px; align-items: center; margin-top: 6px; background: #f1f5f9; padding: 6px; border-radius: 6px;">
                    <span style="font-size: 12px; font-weight: 700; color: #334155; width: 60px;">Evidencia ${f}:</span>
                    <button type="button" class="custom-file-btn" style="flex: 1; padding: 6px; margin:0;" onclick="seleccionarFoto('rec', ${f}, 'camara')"> Cámara</button>
                    <button type="button" class="custom-file-btn" style="flex: 1; padding: 6px; margin:0;" onclick="seleccionarFoto('rec', ${f}, 'galeria')"> Galería</button>
                    <input type="file" id="foto_rec_${f}" style="display:none;" accept="image/*" onchange="actualizarTextoFoto(this, 'rec', ${f})">
                    <span id="texto-foto-rec-${f}" class="texto-foto" style="flex: 1.5; text-align: left;">No seleccionada</span>
                </div>`;
            }
            contenedor.innerHTML = html;
        }

        window.seleccionarFoto = function(index, numFoto, modo) {
            const input = document.getElementById(`foto_${index}_${numFoto}`);
            if (modo === 'camara') { input.setAttribute('capture', 'environment'); } 
            else { input.removeAttribute('capture'); }
            input.click(); 
        };

        window.actualizarTextoFoto = function(input, index, numFoto) {
            const spanTexto = document.getElementById(`texto-foto-${index}-${numFoto}`);
            if (input.files && input.files.length > 0) {
                spanTexto.innerHTML = `Lista`;
                spanTexto.classList.add('foto-ok');
            } else {
                spanTexto.innerHTML = "No seleccionada";
                spanTexto.classList.remove('foto-ok');
            }
        };

        function verificarSerieHistorial() {
            const serie = document.getElementById('serie-reclamo').value.trim();
            const msj = document.getElementById('mensaje-reclamo');
            camposReporteReclamo.classList.add('oculto');
            
            idsReclamacion.forEach(id => document.getElementById(id).required = false);
            
            if(!serie) {
                msj.innerText = " Escribe un número de serie válido.";
                msj.style.color = "#E60404";
                return;
            }
            msj.innerText = "Buscando registro en historial... ⏳";
            msj.style.color = "#64748b";
            
            google.script.run
              .withSuccessHandler(function(resultado) {
                if(resultado) {
                    msj.innerHTML = ` Serie localizada: <b>${resultado.modelo}</b><br>Inspeccionada el: ${resultado.fecha} por ${resultado.inspector}`;
                    msj.style.color = "#10b981";
                    camposReporteReclamo.classList.remove('oculto');
                    
                    idsReclamacion.forEach(id => document.getElementById(id).required = true);
                    
                    document.getElementById('contenedor').value = resultado.contenedor;
                    document.getElementById('referencia').value = resultado.referencia;
                    document.getElementById('rec-modelo').value = resultado.modelo;
                    modeloReclamoTemporal = resultado.modelo;
                } else {
                    msj.innerText = " No se encontró ningún registro de Incoming con esta serie.";
                    msj.style.color = "#E60404";
                }
              })
              .withFailureHandler(function(error) {
                msj.innerText = " Error de red o servidor: " + error.message;
                msj.style.color = "#E60404";
                alert("Falla del servidor: " + error.message + "\n\nRECUERDA: Si acabas de guardar los cambios, debes probarlos usando la URL de pruebas que termina en '/dev'.");
              })
              .consultarRegistroPorSerie(serie);
        }

        function buscarRefaccion() {
            const query = document.getElementById('buscador-codigo').value.trim().toUpperCase();
            const msj = document.getElementById('mensaje-busqueda');
            bloquePiezas.innerHTML = '';
            zonaEvaluacion.style.display = 'none';
            refaccionActual = null;

            if (!query) { msj.innerText = "Ingresa un código válido."; msj.style.color = "#E60404"; return; }
            const item = listaRefacciones.find(r => r.arCode.toUpperCase() === query || r.erpCode.toUpperCase() === query);

            if (item) {
                msj.innerText = "Refacción encontrada."; msj.style.color = "#10b981";
                refaccionActual = item; 
                let tituloVisual = `<span style="color: #64748b;">AR:</span> ${item.arCode}    |    <span style="color: #64748b;">ERP:</span> ${item.erpCode} <br><span style="font-size: 14px; font-weight: normal; color: #4A5568; display: block; margin-top: 4px;">${item.descripcion}</span>`;
                let tituloBackend = `NP: ${item.erpCode} - ${item.descripcion}`;
                let subtitulo = `Ordenado: <b>${item.ordenado}</b>    |    Enviado (A revisar): <b style="color: var(--primary); font-size: 14px;">${item.enviado}</b>`;
                
                bloquePiezas.innerHTML = generarBloqueHTML(0, tituloVisual, subtitulo, tituloBackend, item.erpCode, true);
                zonaEvaluacion.style.display = 'block';
            } else {
                msj.innerText = "❌ Código no encontrado en la lista de pendientes."; msj.style.color = "#E60404";
            }
        }

        selectMaquina.addEventListener('change', function() {
            const maquinaElegida = selectMaquina.value;
            const piezas = baseDeDatosMaquinas[maquinaElegida];
            bloquePiezas.innerHTML = ''; 

            if (piezas && piezas.length > 0) {
                let htmlContenido = `<h3 style="color: var(--accent); margin-bottom: 24px; font-size: 20px;">Equipo: <span style="color: var(--primary);">${maquinaElegida}</span></h3>`;
                piezas.forEach((item, index) => {
                    htmlContenido += generarBloqueHTML(index, item.pieza, item.criterio, item.pieza, "Pieza", false);
                });
                bloquePiezas.innerHTML = htmlContenido;
                zonaEvaluacion.style.display = 'block';
            }
        });

        function optimizarImagen(file, maxWidth = 1024, maxHeight = 1024, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height = Math.round(height *= maxWidth / width); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round(width *= maxHeight / height); height = maxHeight; }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        formulario.addEventListener('submit', async function(evento) {
            evento.preventDefault();
            
            if (modoActual === 'reclamaciones' && camposReporteReclamo.classList.contains('oculto')) {
                alert("Por favor, verifica un número de serie válido antes de enviar tu reclamación.");
                return;
            }
            if (modoActual === 'refacciones' && !refaccionActual) {
                alert("Por favor, busca y selecciona una refacción válida antes de enviar.");
                return;
            }

            boton.disabled = true;
            boton.innerText = "Subiendo datos... ⏳";

            let confirmarSobrescritura = false;
            if (modoActual === 'maquinas') {
                const serieConsultada = document.getElementById('serie').value.trim();
                boton.innerText = "Verificando número de serie... ⏳";
                try {
                    const estado = await new Promise((resolve, reject) => {
                        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
                            .consultarSerieExistente(serieConsultada);
                    });
                    if (modoActual !== 'maquinas' || document.getElementById('serie').value.trim() !== serieConsultada) {
                        alert("El número de serie cambió durante la consulta. Revisa los datos y vuelve a enviar.");
                        boton.disabled = false;
                        boton.innerText = "ENVIAR REPORTE";
                        return;
                    }
                    if (estado.existe) {
                        const ubicaciones = [
                            estado.enIncoming ? 'Respuestas' : null,
                            estado.enBitacora ? 'Bitácora' : null
                        ].filter(Boolean).join(' y ');
                        confirmarSobrescritura = confirm(
                            `La serie ${serieConsultada} ya existe en ${ubicaciones}. ¿Deseas reemplazar sus datos y el enlace del PDF? ` +
                            'Las fotos y reportes anteriores permanecerán en Drive.'
                        );
                        if (!confirmarSobrescritura) {
                            boton.disabled = false;
                            boton.innerText = "ENVIAR REPORTE";
                            return;
                        }
                    }
                    boton.innerText = "Subiendo datos... ⏳";
                } catch (error) {
                    alert("No se pudo comprobar el número de serie: " + (error.message || error));
                    boton.disabled = false;
                    boton.innerText = "ENVIAR REPORTE";
                    return;
                }
            }

            const referenciaComun = document.getElementById('referencia').value;

            if (modoActual === 'reclamaciones') {
                const chkAcuse = document.getElementById('req-acuse').checked;
                const chkReposicion = document.getElementById('req-reposicion').checked;
                const chkCompensacion = document.getElementById('req-compensacion').checked;
                const chkRevision = document.getElementById('req-revision').checked;

                if (!chkAcuse && !chkReposicion && !chkCompensacion && !chkRevision) {
                    alert("⚠️ Debes seleccionar al menos un Requerimiento para el Proveedor antes de enviar.");
                    boton.disabled = false;
                    boton.innerText = "ENVIAR REPORTE";
                    return;
                }

                try {
                    let fotosReclamo = [];
                    for (let f = 1; f <= 3; f++) {
                        const fInput = document.getElementById(`foto_rec_${f}`);
                        if (fInput && fInput.files.length > 0) {
                            const file = fInput.files[0];
                            const base64 = await optimizarImagen(file);
                            fotosReclamo.push({
                                base64: base64,
                                nombre: `Reclamo_${document.getElementById('serie-reclamo').value}_F${f}_${file.name}`
                            });
                        }
                    }

                    const datosReclamacion = {
                        correo: document.getElementById('correo').value,
                        serie: document.getElementById('serie-reclamo').value.trim(),
                        modelo: modeloReclamoTemporal,
                        contenedor: document.getElementById('contenedor').value,
                        referencia: referenciaComun,
                        defecto: document.getElementById('rec-defecto').value.trim(),
                        etapa: document.getElementById('rec-etapa').value,
                        justificacion: document.getElementById('rec-justificacion').value.trim(),
                        fotos: fotosReclamo,
                        cHoras: document.getElementById('rec-horas').value,
                        cCosto: document.getElementById('rec-costo').value,
                        reqAcuse: document.getElementById('req-acuse').checked,
                        reqReposicion: document.getElementById('req-reposicion').checked,
                        reqCompensacion: document.getElementById('req-compensacion').checked,
                        reqRevision: document.getElementById('req-revision').checked,
                        clSeveridad: document.getElementById('cl-severidad').value,
                        clReincidencia: document.getElementById('cl-reincidencia').value,
                        clImpacto: document.getElementById('cl-impacto').value
                    };

                    google.script.run.withSuccessHandler(exitoEnvio).withFailureHandler(fallaEnvio).guardarReclamacion(datosReclamacion);

                } catch (err) {
                    alert("Error al empaquetar imágenes de reclamación.");
                    boton.disabled = false; boton.innerText = "ENVIAR REPORTE";
                }
                return;
            }

            const totalItems = modoActual === 'maquinas' ? baseDeDatosMaquinas[selectMaquina.value].length : 1;
            let evaluaciones = [];

            try {
                for (let i = 0; i < totalItems; i++) {
                    const seleccion = document.querySelector(`input[name="eval_${i}"]:checked`).value;
                    const comentario = document.getElementById(`comentario_${i}`).value.trim();
                    const nombreEval = document.getElementById(`nombreEval_${i}`).value;
                    const idEval = document.getElementById(`idEval_${i}`).value;
                    
                    let cantidadEval = "N/A"; let disposicionIndividual = "N/A";
                    if (modoActual === 'refacciones' && refaccionActual) {
                        cantidadEval = refaccionActual.enviado;
                        disposicionIndividual = document.getElementById(`disp_item_${i}`).value;
                    }
                    
                    let listaFotosSubir = [];
                    for (let f = 1; f <= 3; f++) {
                        const fotoInput = document.getElementById(`foto_${i}_${f}`);
                        if (fotoInput && fotoInput.files.length > 0) {
                            const file = fotoInput.files[0];
                            const fotoBase64 = await optimizarImagen(file);
                            let fotoNombre = modoActual === 'maquinas' ? 
                                `Serie_${document.getElementById('serie').value}_${nombreEval}_F${f}_${file.name}` :
                                `Ref_${referenciaComun}_${idEval}_F${f}_${file.name}`;

                            listaFotosSubir.push({ base64: fotoBase64, nombre: fotoNombre });
                        }
                    }

                    evaluaciones.push({
                        pieza: nombreEval, cantidad: cantidadEval, disposicionItem: disposicionIndividual,
                        seleccion: seleccion, comentario: comentario, fotos: listaFotosSubir
                    });
                }

                const datosBase = {
                    correo: document.getElementById('correo').value,
                    contenedor: document.getElementById('contenedor').value,
                    referencia: referenciaComun, 
                    comentariosGenerales: document.getElementById('comentarios-generales').value.trim(), 
                    disposicion: document.getElementById('disposicion') ? document.getElementById('disposicion').value : "N/A",
                    evaluaciones: evaluaciones,
                    codigoRefaccion: (modoActual === 'refacciones' && refaccionActual) ? refaccionActual.erpCode : null 
                };

                if (modoActual === 'maquinas') {
                    datosBase.serie = document.getElementById('serie').value;
                    datosBase.nombreMaquina = selectMaquina.value;
                    datosBase.proveedor = document.getElementById('proveedor').value;
                    datosBase.confirmarSobrescritura = confirmarSobrescritura;
                    google.script.run.withSuccessHandler(exitoEnvio).withFailureHandler(fallaEnvio).guardarDatos(datosBase);
                } else {
                    google.script.run.withSuccessHandler(exitoEnvio).withFailureHandler(fallaEnvio).guardarRefacciones(datosBase); 
                }

            } catch (error) {
                alert("Error al procesar imágenes de inspección.");
                boton.disabled = false; boton.innerText = "ENVIAR REPORTE";
            }
        });

        function exitoEnvio(respuesta) {
            const exitoParcial = typeof respuesta === 'string' && respuesta.startsWith('Éxito parcial:');
            if(respuesta === "Éxito" || exitoParcial) {
                if(modoActual === 'maquinas' || modoActual === 'reclamaciones') {
                    alert(exitoParcial ? respuesta :
                        (modoActual === 'maquinas' ? "¡Reporte de Incoming enviado!" : "¡Reporte de Reclamación formal guardado!"));
                    formulario.reset();
                    construirSlotsFotosReclamacion(); 
                    cambiarModo('maquinas');
                } else {
                    listaRefacciones = listaRefacciones.filter(r => r.erpCode !== refaccionActual.erpCode);
                    document.getElementById('buscador-codigo').value = '';
                    document.getElementById('mensaje-busqueda').innerText = 'Guardado. Escanea la siguiente refacción.';
                    document.getElementById('mensaje-busqueda').style.color = '#3b82f6';
                    bloquePiezas.innerHTML = ''; zonaEvaluacion.style.display = 'none';
                    refaccionActual = null;
                    document.getElementById('buscador-codigo').focus(); 
                }
            } else {
                alert("Error del servidor: " + respuesta);
            }
            boton.disabled = false; boton.innerText = "ENVIAR REPORTE";
        }

        function fallaEnvio(error) {
            alert("Falla crítica de red o error del servidor.");
            boton.disabled = false; boton.innerText = "ENVIAR REPORTE";
        }
    </script>
</body>
</html>
